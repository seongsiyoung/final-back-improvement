spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:postgresql://localhost:5432/placeholder
    username: placeholder
    password: placeholder
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database: postgresql
    database-platform: org.hibernate.spatial.dialect.postgis.PostgisPG95Dialect

  data:
    redis:
      host: localhost
      port: 6379

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

  cloud:
    aws:
      credentials:
        access-key: test-access-key
        secret-key: test-secret-key
      region:
        static: ap-northeast-2

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
      enabled: true

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: test-kakao-client-id
            client-secret: test-kakao-client-secret
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "http://localhost:8080/login/oauth2/code/kakao"
            scope:
              - profile_nickname
          naver:
            client-id: test-naver-client-id
            client-secret: test-naver-client-secret
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "http://localhost:8080/login/oauth2/code/naver"
            scope:
              - nickname
              - email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

  mail:
    host: localhost
    port: 2525
    username: test
    password: test
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

custom:
  s3:
    bucket: test-bucket

coolsms:
  api-key: test-api-key
  api-secret: test-api-secret
  sender: "01000000000"

security:
  jwt:
    secret: "test-jwt-secret-key-must-be-at-least-32-bytes-long"
    access-token-validity-seconds: 1800
    refresh-token-validity-seconds: 1209600

logging:
  level:
    root: WARN
    com.example.finalproject: INFO

toss:
  payments:
    base-url: "http://localhost:0"
    secret-key: test-toss-secret
    connect-timeout-ms: 500
    read-timeout-ms: 1000
  circuit-breaker:
    wait-duration-in-open-state-ms: 500

crypto:
  billing:
    aes-key: "XIp4d7uD5skv4Xjol7YYPDyBq1ZSQ8VO7NAV9F8RBjw="

kakao:
  frontend-success-url: "http://localhost:3000"

naver:
  frontend-success-url: "http://localhost:3000"

password-reset:
  redis-prefix: "test:pwdreset:"
  rate-limit-prefix: "test:pwdreset:ratelmit:"
  expiry-minutes: 30
  reset-url: "http://localhost:3000/reset-password"
  request-cooldown-seconds: 60

cors:
  allowed-origins: "http://localhost:3000"
